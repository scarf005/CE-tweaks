name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  MOD_PACKAGE_ID: "scarf.CombatExtended.tweaks"
  SOLUTION_FILE: Source/CEOverPressure/CEOverPressure.fsproj
  RIMWORLD_DIR: ${{ github.workspace }}/RimWorld

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: check RimWorld 1.7 references
        run: |
          test -f "$RIMWORLD_DIR/UnityStubs.dll" || {
            echo "::error::RimWorld 1.7 reference assemblies are not publicly available; build releases locally with 'just build'."
            exit 1
          }

      - name: download Combat Extended
        run: |
          gh release download -R CombatExtended-Continued/CombatExtended -p '*.zip' -O ce.zip
          unzip -q ce.zip -d ce
          echo "COMBAT_EXTENDED_DIR=$(realpath ce)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: build
        run: |
          dotnet build '${{ env.SOLUTION_FILE }}' -c Release
          mkdir -p Source/obj/rimworld-1.6
          git archive origin/rimworld-1.6 Source | tar -x -C Source/obj/rimworld-1.6
          dotnet build "Source/obj/rimworld-1.6/$SOLUTION_FILE" -c Release -p:OutputPath="$PWD/1.6/Assemblies/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}
          path: |
            1.6/Assemblies/CETweaks.dll
            1.7/Assemblies/CETweaks.dll

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}

      - name: create mod archive
        run: |
          dist="dist/$MOD_PACKAGE_ID"
          mkdir -p "$dist"
          cp -r About LoadFolders.xml "$dist"/
          for dir in Defs Languages Patches; do
            [ -d "$dir" ] && cp -r "$dir" "$dist"/
          done
          cp -r 1.6 1.7 "$dist"/
          cd dist && zip -r "../$MOD_PACKAGE_ID-${{ github.ref_name }}.zip" "$MOD_PACKAGE_ID"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
